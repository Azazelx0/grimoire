[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire-wordlist"
version = "2.2.3"
description = "GRIMOIRE — Where words are forged into weapons. Advanced wordlist generator."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "GRIMOIRE"}]
keywords = ["wordlist", "password", "pentesting", "security", "OSINT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
headless = ["playwright>=1.40"]
markov = ["numpy>=1.24"]
all = ["playwright>=1.40", "numpy>=1.24"]

[project.scripts]
grimoire = "grimoire.cli:main"

[project.urls]
Homepage = "https://github.com/Azazelx0/grimoire"
Repository = "https://github.com/Azazelx0/grimoire"

[tool.setuptools.packages.find]
include = ["grimoire*"]

[tool.setuptools.package-data]
grimoire = ["data/*.csv", "data/locales/*.txt"]
